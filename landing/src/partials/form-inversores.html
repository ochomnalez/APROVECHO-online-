        <form class="form form--inv" id="form-inv" novalidate data-form="inversores" aria-labelledby="inv-t">
        <h3 id="inv-t">¿Querés conocer más?</h3>
        <p>Te mandamos el resumen del proyecto y coordinamos una charla.</p>
        <div class="form__grid">
        <div class="field"><label for="i-nombre">Nombre y apellido</label><input id="i-nombre" name="nombre" type="text" autocomplete="name" required><p class="err" role="alert"></p></div>
        <div class="field"><label for="i-email">Email</label><input id="i-email" name="email" type="email" autocomplete="email" required><p class="err" role="alert"></p></div>
        <div class="field"><label for="i-org">Organización <span>(opcional)</span></label><input id="i-org" name="organizacion" type="text" placeholder="Fondo, aceleradora, universidad…"></div>
        <div class="field"><label for="i-perfil">Perfil</label><select id="i-perfil" name="perfil" required><option value="">Elegí uno</option><option>Inversor ángel</option><option>Fondo de inversión</option><option>Aceleradora o incubadora</option><option>Universidad o jurado</option><option>Corporativo</option><option>Otro</option></select><p class="err" role="alert"></p></div>
        </div>
        <fieldset class="plansel plansel--chk"><legend>¿Qué te interesa? <span>(opcional)</span></legend>
        <label><input type="checkbox" name="interes" value="resumen"><span>Recibir el resumen</span></label>
        <label><input type="checkbox" name="interes" value="charla"><span>Charlar con el equipo</span></label>
        <label><input type="checkbox" name="interes" value="piloto"><span>Ser parte de un piloto</span></label>
        </fieldset>
        <div class="field"><label for="i-msg">Mensaje <span>(opcional)</span></label><textarea id="i-msg" name="mensaje" rows="3" placeholder="Contanos qué te gustaría saber."></textarea></div>
        <div class="check"><input id="i-ok" name="consent" type="checkbox" required><label for="i-ok">Acepto la Política de privacidad.</label></div><p class="err" role="alert" data-for="consent"></p>
        <button class="btn btn--lg btn--accent" type="submit">Pedí información</button>
        <div class="form__ok" hidden tabindex="-1" data-ok><p class="form__ok-t">Gracias. Te escribimos en los próximos días.</p></div>
        </form>

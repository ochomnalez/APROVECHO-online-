<section class="hero hr" id="inicio" aria-labelledby="hero-t">
  <div class="hr__bg" aria-hidden="true">
    <div class="hr__media">
      <div class="hr__clip is-on" data-clip="1-publica">
        <img src="video/hero-ia/1-publica.webp" width="1280" height="720" alt="" fetchpriority="high" decoding="async">
        <video muted playsinline preload="none" disablepictureinpicture disableremoteplayback tabindex="-1"></video>
      </div>
      <div class="hr__clip" data-clip="2-balanza">
        <img data-src="video/hero-ia/2-balanza.webp" width="1280" height="720" alt="" decoding="async">
        <video muted playsinline preload="none" disablepictureinpicture disableremoteplayback tabindex="-1"></video>
      </div>
      <div class="hr__clip" data-clip="3-entrega">
        <img data-src="video/hero-ia/3-entrega.webp" width="1280" height="720" alt="" decoding="async">
        <video muted playsinline preload="none" disablepictureinpicture disableremoteplayback tabindex="-1"></video>
      </div>
    </div>
    <div class="hr__veil"></div>
  </div>
  <div class="wrap hr__in">
    <div class="hr__copy">
      <p class="eyebrow">Para comercios de comida</p>
      <h1 id="hero-t">Vendé lo que te sobra <em>con una foto.</em></h1>
      <p class="hr__lead">Publicá packs a mitad de precio para tus vecinos y medí para que cada vez te sobre menos. Sin costo fijo: pagás solo cuando vendés.</p>
      <div class="hero__actions">
        <a class="btn btn--lg" href="#alta" data-cta="hero">Sumá tu comercio</a>
        <a class="btn btn--lg btn--ghost" href="#consumidores" data-app>Descargá la app</a>
      </div>
    </div>
  </div>
  <div class="hr__foot">
    <div class="wrap">
      <div class="hr__rail" role="group" aria-label="Video de fondo">
        <button class="hr__pause" type="button" aria-label="Pausar el video de fondo" data-hr-pause>
          <svg class="hr__ico hr__ico--pause" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><rect x="3" y="2" width="3.4" height="12" rx="1"/><rect x="9.6" y="2" width="3.4" height="12" rx="1"/></svg>
          <svg class="hr__ico hr__ico--play" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M4 2.2v11.6a.8.8 0 0 0 1.2.7l9-5.8a.8.8 0 0 0 0-1.4l-9-5.8A.8.8 0 0 0 4 2.2z"/></svg>
        </button>
        <div class="hr__bars">
          <button class="hr__bar" type="button" aria-label="Ver: Publicás en segundos" aria-current="true"><i><b></b></i></button>
          <button class="hr__bar" type="button" aria-label="Ver: Medís con balanza"><i><b></b></i></button>
          <button class="hr__bar" type="button" aria-label="Ver: Tu vecino lo retira"><i><b></b></i></button>
        </div>
        <p class="hr__cap" aria-live="off" data-hr-cap>Publicás en segundos</p>
      </div>
    </div>
  </div>
</section>

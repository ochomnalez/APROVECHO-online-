<!-- ============ v5 · RECORRIDO COMPLETO: video de onboarding (ob-) ============ -->
<section class="sec ob" id="recorrido" aria-labelledby="ob-t">
  <div class="wrap">
    <header class="ob__head">
      <p class="eyebrow">Recorrido completo</p>
      <h2 class="sec__title ob__title" id="ob-t">Mirá cómo funciona la app.</h2>
      <p class="sec__text ob__lead">Un recorrido por el producto: del alta al panel, en un minuto y medio.</p>
    </header>

    <div class="ob__frame">
      <div class="ob__player" id="ob-player">
        <img class="ob__poster" src="video/onboarding/onboarding-poster.webp" width="1920" height="1080" alt="" loading="lazy" decoding="async">
        <video class="ob__video" id="ob-video" preload="none" playsinline hidden poster="video/onboarding/onboarding-poster.webp" width="1920" height="1080" data-src="video/onboarding/onboarding-1080.mp4" aria-label="Video: cómo es tu primer día con APROVECHO, del alta al primer pack vendido"></video>
        <button class="ob__play" id="ob-play" type="button" aria-label="Reproducir el video del recorrido completo, 1 minuto y 31 segundos">
          <span class="ob__ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z" fill="currentColor"/></svg></span>
          <span class="ob__lab">Ver el recorrido <small>1:31 · con voz</small></span>
        </button>
      </div>
    </div>

    <div class="ob__cta">
      <a class="btn btn--lg" href="#alta" data-cta="onboarding">Sumá tu comercio</a>
      <p>Sin costo fijo. Pagás solo por cada pack vendido.</p>
    </div>
  </div>
</section>
